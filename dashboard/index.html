<!doctype html>
<!-- Owner: Person C. STUB dashboard: polls the backend every 2s. Nothing fancy. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electron Dispatch</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#e4e4e0; --accent:#2f6fed; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --fg:#ecece8; --muted:#9a9a93; --card:#1e1e1c; --line:#2e2e2b; --accent:#6c9bff; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; }
  header h1 { font-size:18px; margin:0; } header span { color:var(--muted); }
  main { display:grid; grid-template-columns:minmax(260px, 380px) 1fr; min-height:calc(100vh - 56px); }
  @media (max-width:720px) { main { grid-template-columns:1fr; } }
  #jobs { border-right:1px solid var(--line); overflow:auto; }
  .job { padding:12px 20px; border-bottom:1px solid var(--line); cursor:pointer; }
  .job.sel { background:var(--card); box-shadow:inset 3px 0 var(--accent); }
  .job .issue { font-weight:600; } .job .meta { color:var(--muted); font-size:12px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:11px; border:1px solid var(--line); }
  .booked { color:#1a8a4a; border-color:currentColor; } .failed { color:#c43c3c; border-color:currentColor; }
  #trace { padding:16px 20px; overflow:auto; }
  .ev { display:grid; grid-template-columns:72px 90px 1fr; gap:10px; padding:6px 0; border-bottom:1px dashed var(--line); white-space:pre-wrap; }
  .ev .t { color:var(--muted); font-variant-numeric:tabular-nums; } .ev .a { font-weight:600; color:var(--accent); }
  .empty { color:var(--muted); padding:20px; }
</style>
</head>
<body>
<header><h1>Electron</h1><span id="status">connecting…</span></header>
<main>
  <section id="jobs"><div class="empty">No jobs yet. Text the Photon number.</div></section>
  <section id="trace"><div class="empty">Select a job to see each agent step.</div></section>
</main>
<script>
let selected = null;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function tick() {
  try {
    const jobs = await (await fetch("/api/jobs")).json();
    document.getElementById("status").textContent = `${jobs.length} jobs · live`;
    if (!selected && jobs.length) selected = jobs[0].id;
    document.getElementById("jobs").innerHTML = jobs.length ? jobs.map(j => `
      <div class="job ${j.id === selected ? "sel" : ""}" onclick="selected='${j.id}';tick()">
        <div class="issue">${esc(j.issue || j.raw_text || "(new)")}</div>
        <div class="meta"><span class="pill ${j.status}">${j.status}</span>
          ${esc(j.urgency || "")} · ${esc(j.customer_phone)}
          ${j.assigned_tech_name ? " · " + esc(j.assigned_tech_name) : ""}
          ${j.quote ? ` · $${j.quote.low}–$${j.quote.high}` : ""}</div>
      </div>`).join("") : `<div class="empty">No jobs yet. Text the Photon number.</div>`;
    if (selected) {
      const evs = await (await fetch(`/api/jobs/${selected}/events`)).json();
      document.getElementById("trace").innerHTML = evs.map(e => `
        <div class="ev"><span class="t">${new Date(e.created_at).toLocaleTimeString()}</span>
        <span class="a">${esc(e.agent)}</span><span>${esc(e.message)}</span></div>`).join("");
    }
  } catch (e) {
    document.getElementById("status").textContent = "backend unreachable";
  }
}
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
